name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  secure:
    name: Enforce HTTPS
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Confirm custom domain for this repository owner
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -f cname=penapisairkesihatan.my \
            -f build_type=workflow >/dev/null

      - name: Enable HTTPS when the certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for attempt in {1..120}; do
            if gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
              -F https_enforced=true >/dev/null 2>&1; then
              echo "HTTPS enforcement enabled."
              exit 0
            fi

            if [ "$attempt" -lt 120 ]; then
              echo "Certificate is not ready yet; retrying in 30 seconds."
              sleep 30
            fi
          done

          echo "::error::GitHub Pages certificate was not ready after 60 minutes."
          exit 1



